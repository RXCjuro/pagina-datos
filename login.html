<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVida - Autenticación Corporativa</title>
    <!-- Carga de Fuente Profesional Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Enlace de Hojas de Estilo Desacopladas -->
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

    <main class="auth-container">
        <header class="auth-header">
            <h2>🌱 EcoVida</h2>
            <p>Ecosistema de Distribución Multicloud</p>
        </header>

        <!-- Pestañas de control de módulo de identidad -->
        <nav class="auth-tabs" aria-label="Opciones de acceso">
            <button id="btnTabLogin" class="tab-btn active" onclick="cambiarPestaña('login')">Ingresar</button>
            <button id="btnTabRegistro" class="tab-btn" onclick="cambiarPestaña('registro')">Registrarse</button>
        </nav>

        <!-- PROCESO 1: AUTENTICACIÓN LOGÍSTICA (PYTHON BACKEND) -->
        <form id="formularioLogin" class="auth-form active" onsubmit="manejarFormularioLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Identificador / Correo Electrónico</label>
                <input type="email" id="loginEmail" placeholder="nombre@empresa.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPassword">Contraseña de Acceso</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>
            <button type="submit" class="auth-btn">Iniciar Sesión</button>
        </form>

        <!-- PROCESO 2: ALTA DE IDENTIDAD REAL (MONGODB ATLAS) -->
        <form id="formularioRegistro" class="auth-form" onsubmit="manejarFormularioRegistro(event)">
            <div class="form-group">
                <label for="regNombre">Nombre Completo Institucional</label>
                <input type="text" id="regNombre" placeholder="Ingresa tu nombre" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="regEmail">Correo Electrónico de Registro</label>
                <input type="email" id="regEmail" placeholder="nombre@empresa.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="regPassword">Establecer Contraseña Segura</label>
                <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" required
                    autocomplete="new-password">
            </div>
            <button type="submit" class="auth-btn">Crear Cuenta Principal</button>
        </form>
    </main>

    <!-- Inyección de la lógica y controladores operacionales -->
    <script src="JS/ecovida.js"></script>
    <script>
        /**
         * Controlador visual dinámico de pestañas basado en clases activas
         */
        function cambiarPestaña(tipo) {
            const loginForm = document.getElementById('formularioLogin');
            const registroForm = document.getElementById('formularioRegistro');
            const tabLogin = document.getElementById('btnTabLogin');
            const tabRegistro = document.getElementById('btnTabRegistro');

            if (tipo === 'login') {
                loginForm.classList.add('active');
                registroForm.classList.remove('active');
                tabLogin.classList.add('active');
                tabRegistro.classList.remove('active');
            } else {
                registroForm.classList.add('active');
                loginForm.classList.remove('active');
                tabRegistro.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        /**
         * Despachador de eventos de Registro para persistir datos reales en MongoDB Atlas
         */
        function manejarFormularioRegistro(evento) {
            evento.preventDefault();

            const nombre = document.getElementById("regNombre").value;
            const correo = document.getElementById("regEmail").value;
            const contrasena = document.getElementById("regPassword").value;

            console.log("[MULTICLOUD] Transmitiendo paquete de registro hacia producción en Render...");

            // Consumimos el endpoint correspondiente concatenando la URL global
            fetch(`${BASE_RENDER_URL}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: nombre, correo: correo, contrasena: contrasena })
            })
                .then(function (response) {
                    return response.json().then(function (data) {
                        if (!response.ok) throw new Error(data.error || "Error estructural en el alta");
                        return data;
                    });
                })
                .then(function (data) {
                    alert("✅ ¡Registro exitoso en MongoDB Atlas! Su módulo de identidad ha sido inicializado.");
                    cambiarPestaña('login');
                })
                .catch(function (error) {
                    alert("❌ Fallo en la operación: " + error.message);
                });
        }


    </script>
    <!-- Inyección de la lógica operacional y controladores visuales de diseño -->
    <script src="JS/ecovida.js"></script>
    <script src="JS/login-diseno.js"></script>
</body>

</html>
