<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO VIDA</title>

    <link rel="stylesheet" href="CSS/estilos.css">
</head>

<body>

    <!--Encabezado -->
    <header>
        <h1>🌱 EcoVida</h1>
        <p>Productos ecológicos y reutilizables</p>
    </header>

    <!-- Menú -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="#">Contacto</a>
        <a href="pedidos.html">📦 Pedidos</a>
        <a href="carrito.html">🛒 Carrito</a>
        <a href="quiz.html">✨ Quiz</a>
        <!-- Componente de Cierre de Sesión Corporativo -->
        <button onclick="cerrarSesionCorporativa()" id="btn-logout-nav" style="
        background-color: #ef4444; 
        color: white; 
        border: none; 
        padding: 8px 16px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 600;
        font-family: sans-serif;
        transition: background 0.2s;
        display: none; /* Se oculta por defecto hasta que el JS verifique la sesión */
    " onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">
            🚪 Cerrar Sesión
        </button>
    </nav>



    <!-- Contacto -->
    <section id="contacto">
        <h2>Contacto</h2>
        <p>¿Tienes alguna consulta? Escríbenos.</p>
        <input type="text" placeholder="Nombre">
        <input type="email" placeholder="Correo">
        <textarea placeholder="Mensaje"></textarea>
        <button>Enviar mensaje</button>
    </section>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 EcoVida - Productos sostenibles</p>
    </footer>

    <!-- JavaScript-->
    <script src="JS/ecovida.js"></script>

</body>

</html>
