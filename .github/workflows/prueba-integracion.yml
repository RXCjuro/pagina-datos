name: Prueba de Integración

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f carrito.html
          test -f pedidos.html
          test -f nosotros.html
          test -f firebase.json
          echo "Todos los archivos principales existen correctamente."

      - name: Verificar carpetas
        run: |
          test -d CSS
          test -d JS
          echo "Las carpetas CSS y JS existen correctamente."

      - name: Prueba de integración
        run: |
          echo "Iniciando prueba de integración..."
          echo "Código descargado correctamente desde GitHub."
          echo "Archivos HTML encontrados."
          echo "Archivos CSS y JavaScript encontrados."
          echo "Configuración de Firebase encontrada."
          echo "PRUEBA DE INTEGRACIÓN EXITOSA."
