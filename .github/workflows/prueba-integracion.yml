name: Prueba de Integración y Despliegue Continuo

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f carrito.html
          test -f pedidos.html
          test -f nosotros.html
          test -f firebase.json
          echo "Todos los archivos principales existen correctamente."

      - name: Verificar carpetas
        run: |
          test -d CSS
          test -d JS
          echo "Las carpetas CSS y JS existen correctamente."

      - name: Ejecutar prueba de integración
        run: |
          node tests/ecovida.test.js

      - name: Instalar Firebase CLI y Desplegar
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
