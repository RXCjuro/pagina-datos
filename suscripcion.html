<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO VIDA - Suscríbete</title>

    <link rel="stylesheet" href="CSS/estilos.css">

    <style>
        #suscripcion label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
        }

        #suscripcion label input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        #suscripcion button {
            display: block;
            margin: 12px auto 0;
        }
    </style>
</head>

<body>

    <!--Encabezado -->
    <header>
        <h1>🌱 EcoVida</h1>
        <p>Productos ecológicos y reutilizables</p>
    </header>

    <!-- Menú -->
    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a href="pedidos.html">📦 Pedidos</a>
        <a href="carrito.html">🛒 Carrito</a>
        <a href="quiz.html">✨ Quiz</a>
        <a href="#">📩 Suscríbete</a>
    </nav>

    <!-- Suscripción -->
    <section id="suscripcion">
        <h2>Suscríbete a EcoVida</h2>
        <p>Recibe novedades y ofertas de productos ecológicos.</p>

        <input type="email" id="correoSuscripcion" placeholder="Correo">

        <label>
            <input type="checkbox" id="aceptoTerminos">
            Acepto que EcoVida use mi correo para enviarme novedades.
        </label>

        <button type="button" id="btnSuscribirse">Suscribirme</button>
        <p id="mensajeSuscripcion"></p>
    </section>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 EcoVida - Productos sostenibles</p>
    </footer>

    <!-- JavaScript Base -->
    <script src="JS/ecovida.js"></script>

    <!-- Script de Conexión Directa con Azure Table Storage -->
    <script>
        document.getElementById('btnSuscribirse').addEventListener('click', async function() {
            const emailInput = document.getElementById('correoSuscripcion').value;
            const aceptoTerminos = document.getElementById('aceptoTerminos').checked;
            const mensajeEl = document.getElementById('mensajeSuscripcion');

            // Validación de correo y términos
            if (!emailInput || !emailInput.includes('@')) {
                mensajeEl.innerText = "Por favor, ingresa un correo válido.";
                mensajeEl.style.color = "red";
                return;
            }

            if (!aceptoTerminos) {
                mensajeEl.innerText = "Debes aceptar los términos para suscribirte.";
                mensajeEl.style.color = "red";
                return;
            }

            mensajeEl.innerText = "Guardando suscripción en Azure...";
            mensajeEl.style.color = "blue";

            // PEGA AQUÍ LA HTTP POST URL COMPLETA COPIADA DE TU LOGIC APP EN AZURE
            const LOGIC_APP_URL = "https://prod-19.brazilsouth.logic.azure.com:443/workflows/c86a15a693324b12bc56fa75cfa59bbb/triggers/When_an_HTTP_request_is_received/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2FWhen_an_HTTP_request_is_received%2Frun&sv=1.0&sig=sBCUN1o-2yVMc2_z0KSRvkckklr7D5QQltZuJfbuocY";

            try {
                const response = await fetch(LOGIC_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: emailInput })
                });

                if (response.ok || response.status === 202) {
                    mensajeEl.innerText = "¡Gracias por suscribirte a EcoVida!";
                    mensajeEl.style.color = "green";
                    document.getElementById('correoSuscripcion').value = "";
                    document.getElementById('aceptoTerminos').checked = false;
                } else {
                    mensajeEl.innerText = "Error al conectar con Azure Table Storage.";
                    mensajeEl.style.color = "red";
                }
            } catch (err) {
                console.error(err);
                mensajeEl.innerText = "Error de red al intentar enviar los datos.";
                mensajeEl.style.color = "red";
            }
        });
    </script>

</body>

</html>
